# Application Configuration
spring.application.name=Campus-Safety
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus_safety
spring.datasource.username=campus_user
spring.datasource.password=CampusSafety123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-minimum-256-bits-long-12345678901234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:it23033@mbstu.ac.bd}
spring.mail.password=${MAIL_PASSWORD:ogtj hhzu evmx aqhh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.SocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Email sender
app.mail.from=it23033@mbstu.ac.bd
app.mail.from-name=Campus Safety

# OTP Configuration
app.otp.expiration-minutes=10
app.otp.length=6
app.otp.max-attempts=5

# File Upload Configuration
app.upload.dir=uploads/audio/
app.upload.max-file-size=52428800
app.upload.allowed-formats=mp3,wav,aac,m4a,flac

# Firebase Configuration
firebase.config.path=firebase-config.json

# Logging Configuration
logging.level.root=INFO
logging.level.com.mbstu.campussafety=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# CORS Configuration
app.cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Server Configuration
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Actuator (for monitoring)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
